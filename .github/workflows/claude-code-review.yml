name: Claude Code Review

# Automatically reviews every pull request with Claude via Amazon Bedrock,
# authenticating with static AWS access keys stored as repo secrets.
#
# One-time setup by a repo admin
# (Settings > Secrets and variables > Actions):
#   Secrets:
#     BEDROCK_AWS_ACCESS_KEY_ID       - AWS access key ID with Bedrock InvokeModel access
#     BEDROCK_AWS_SECRET_ACCESS_KEY   - matching AWS secret access key
#   Variables (optional; defaults below):
#     BEDROCK_AWS_REGION              - default ap-southeast-1
#     ANTHROPIC_MODEL                - default global.anthropic.claude-sonnet-4-5-20250929-v1:0
# See the README section "Claude code review (Bedrock)" for details.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BEDROCK_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.BEDROCK_AWS_REGION || 'ap-southeast-1' }}
          AWS_DEFAULT_REGION: ${{ vars.BEDROCK_AWS_REGION || 'ap-southeast-1' }}
        with:
          # Use the built-in Actions token to post comments (no Claude GitHub App / OIDC).
          github_token: ${{ github.token }}
          use_bedrock: "true"

          # Show review progress as checkboxes on the PR.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for the PingCAP Content Brief Generator,
            a Python CLI (brief.py) that pulls data from external APIs (DataForSEO,
            SEMrush, Google Search Console, Claude) and generates SEO/AEO content
            briefs. Focus your review on:

            1. **Correctness**
               - Logic bugs, wrong control flow, and unhandled edge cases in the pipeline steps.
               - Response parsing of external APIs (missing keys, empty results, rate limits).

            2. **Security & secrets**
               - No API keys, tokens, or credentials committed or logged.
               - Environment variables read safely; .env stays out of version control.
               - Safe handling of any URLs, subprocesses, or file writes.

            3. **Robustness of external calls**
               - Network/HTTP error handling, timeouts, retries, and graceful degradation
                 when an upstream API (DataForSEO/SEMrush/GSC) fails or returns nothing.

            4. **Python quality**
               - Readability and maintainability, clear naming, and reasonable structure.
               - Avoidable inefficiencies and dead code.

            5. **Docs**
               - README / .env.example stay accurate when flags, env vars, or steps change.

            Leave inline comments for specific issues and a short top-level summary.
            Be concise; skip nitpicks that don't affect correctness, security, or clarity.

          # --model must be a Bedrock model / inference-profile ID enabled in your account.
          claude_args: |
            --model ${{ vars.ANTHROPIC_MODEL || 'global.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
