name: Refresh sitemap inventory

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build verified PingCAP URL inventory
        run: python build_sitemap_inventory.py

      - name: Commit refreshed inventory
        run: |
          if [ -z "$(git status --porcelain -- sitemap_inventory.json)" ]; then
            echo "Inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap_inventory.json
          git commit -m "Refresh PingCAP sitemap inventory"
          git push
