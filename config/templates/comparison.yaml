# Comparison and alternative pages, following the approved PingCAP comparison
# briefs (Supabase alternative, PlanetScale alternatives, MongoDB vs MySQL, Aug
# 2026). Sections are matched to article H2s by the `match` patterns
# (case-insensitive regex on the heading text).
content_types: [comparison, alternative]
max_h2: 10
# The FAQ H2 sits immediately before the closing H2.
faq_section: faqs
primary_cta_section: decision
mechanism_section: how_tidb_solves

# Word budget weights, in outline order. Must sum to 100.
word_weights:
  H1 introduction: 6
  AEO answer: 8
  At a glance: 9
  Capabilities comparison: 11
  Integrations and developer workflow: 10
  Deployment, governance, multi-tenant architecture: 9
  Support, reviews, market signals: 7
  Pricing: 8
  How TiDB solves: 12
  FAQs: 8
  Decision endcap: 12

sections:
  - id: aeo_answer
    position: 1
    label: AEO answer
    match: ['.']
  - id: at_a_glance
    position: 2
    label: At a glance
    match: ['(?i)at a glance']
    # The validated table lives in the brief, so this H2 gets more room.
    max_words: 320
    table:
      columns: [Category, "{competitor}", TiDB product, Best fit]
      min_rows: 8
      max_rows: 10
      required_categories:
        - {id: database_model, label: database model, match: '(?i)database model|data model'}
        - {id: vector_support, label: vector support, match: '(?i)vector'}
        - {id: auth, label: auth, match: '(?i)\bauth'}
        - {id: storage, label: storage, match: '(?i)storage'}
        - {id: mcp_ai_tooling, label: MCP/AI tooling workflow, match: '(?i)\bmcp\b|ai tooling'}
        - {id: setup, label: setup/provisioning, match: '(?i)setup|provisioning'}
        - {id: multi_tenant, label: multi-tenant scale, match: '(?i)multi[- ]tenan'}
        - {id: operational_tradeoffs, label: operational tradeoffs, match: '(?i)operational|tradeoff'}
        - {id: pricing_model, label: pricing model, match: '(?i)pricing'}
      # A competitor cell may not be blank or a placeholder.
      empty_cell_pattern: '^(?:|-+|n/?a|none|no|unknown|not available|tbd)$'
      requires_sources: true
  - id: capabilities
    label: capabilities comparison
    match: ['(?i)capabilit']
    key_differences: true
  - id: integrations
    label: integrations and developer workflow
    match: ['(?i)integration', '(?i)developer workflow']
    key_differences: true
    required_terms: ['(?i)\bmcp\b', '(?i)sql client', '(?i)framework']
  - id: deployment
    label: deployment, governance, multi-tenant architecture
    match: ['(?i)deploy', '(?i)governance', '(?i)multi[- ]tenan']
    key_differences: true
  - id: reviews
    label: support, reviews, market signals
    match: ['(?i)review', '(?i)market signal']
    key_differences: true
    reviews: true
  - id: pricing
    label: pricing
    match: ['(?i)pricing', '(?i)\bcost']
    key_differences: true
    pricing: true
  - id: how_tidb_solves
    label: How TiDB solves [problem named in the intro]
    match: ['(?i)^how tidb solves\b']
    requires_mechanism: true
  - id: faqs
    position: -2
    label: FAQs
    match: ['(?i)\bfaqs?\b', '(?i)frequently asked']
  - id: decision
    position: -1
    label: decision endcap with evaluation criteria
    match: ['(?i)decision', '(?i)evaluat', '(?i)choos', '(?i)criteria']
    required_terms: ['(?i)criteria']

mechanisms:
  - distributed SQL on TiKV
  - TiKV
  - Raft
  - Multi-Raft
  - TiFlash
  - HTAP
  - native VECTOR type
  - VECTOR
  - PD placement driver
  - MVCC
  - two-phase commit
  - online DDL
  - TiDB Cloud Zero
  - per-agent isolation

guidance: |
  For comparison and alternative pages, the outline must contain exactly these
  10 H2s in this order. Adapt heading wording to the topic and search intent, but
  keep each H2's purpose and the fixed wording noted below.

  **H2 1: AEO answer.** The heading directly answers the primary keyword's core
  question. The first 2 to 3 sentences are a self-contained, extractable answer.

  **H2 2: "[Topic] at a glance".** A table with exactly these columns:
  Category | [Competitor name] | TiDB product | Best fit. 8 to 10 rows. It must
  include rows for each of these categories: database model, vector support, auth,
  storage, MCP/AI tooling workflow, setup/provisioning, multi-tenant scale,
  operational tradeoffs, pricing model. Fill every competitor cell with the
  competitor's actual capability. If the competitor offers a feature in a row's
  category (for example a hosted MCP server), describe it: never omit competitor
  strengths. Under the table, add a "Sources:" line listing a source URL for the
  competitor claims, marked "{{claims.verify_marker}}".

  **H2 3: Capabilities comparison.**
  **H2 4: Integrations and developer workflow.** Cover MCP, SQL clients, and
  frameworks for both products.
  **H2 5: Deployment, governance, and multi-tenant architecture.**
  **H2 6: Support, reviews, and market signals.** Point the writer to the exact
  G2, Capterra, and Clutch pages for each product and instruct them to capture
  the score, review count, and retrieval date. Never state or invent a rating.
  {{review_sources}}
  **H2 7: Pricing.** Competitor numbers only with a source URL and year, each
  marked "{{claims.verify_marker}}". For TiDB, describe the billing model unless
  public numbers are verifiable from a pingcap.com source.
  **H2 8: "How TiDB solves [the problem named in the intro]".** The heading starts
  with "How TiDB solves". Name the actual mechanism (for example distributed SQL
  on TiKV/Raft, HTAP with TiFlash, the native VECTOR type) in the first sentence
  of the guidance and explicitly tie it back to the intro's problem. A generic
  feature list does not satisfy this.
  **H2 9: FAQs.**
  **H2 10: Decision endcap.** Give the reader evaluation criteria for choosing
  between the two products, then the primary CTA.

  Every comparison H2 (3 to 7) includes an H3 titled "Key differences". In the
  brief, H3s are heading lines only; the H2's guidance bullets cover them.
  Write H2s as questions where the SERP supports it. Introduce TiDB late and
  keep the comparison fair: describe competitor strengths and say when the
  competitor is the better choice.

checklist: |
  23. The outline has the 10 comparison H2s in order: AEO answer, at a glance,
      capabilities, integrations and developer workflow, deployment/governance/
      multi-tenant, support/reviews/market signals, pricing, How TiDB solves,
      FAQs, decision endcap.
  24. The at-a-glance table has columns Category | [Competitor] | TiDB product |
      Best fit, 8 to 10 rows covering all nine required categories, every
      competitor cell filled, and a Sources line.
  25. H2s 3 to 7 each include a "Key differences" H3.
  26. For alternative pages, the FAQ includes at least one question about a
      competitor capability and one about migration.
