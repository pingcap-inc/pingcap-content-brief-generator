# Comparison ("TiDB vs X") and alternative pages. The structure mirrors the live
# pages under https://www.pingcap.com/compare/ (for example tidb-vs-oceanbase,
# tidb-vs-postgresql-2026-comparison-guide, vitess-vs-tidb, mysql-vs-tidb).
# Sections are matched to article H2s by the `match` patterns (case-insensitive
# regex on the heading text), and must appear in this order.
content_types: [comparison, alternative]
max_h2: 10
# The FAQ H2 closes the page, as on the live /compare/ pages.
faq_section: faqs
primary_cta_section: how_tidb_helps
mechanism_section: how_tidb_helps

# Word budget weights, in outline order. Must sum to 100.
word_weights:
  H1 introduction: 6
  At a glance: 12
  Architecture: 11
  Compatibility and migration: 10
  Scaling, performance, and availability: 11
  HTAP, analytics, and AI workloads: 9
  Operations and ecosystem: 9
  Pricing and total cost: 8
  Who should choose: 8
  How TiDB helps: 9
  FAQs: 7

sections:
  - id: at_a_glance
    position: 1
    label: TiDB vs [Competitor] at a glance
    match: ['(?i)at[- ]a[- ]glance', '(?i)side[- ]by[- ]side']
    key_differences: true
    # The validated table lives in the brief, so this H2 gets more room.
    max_words: 320
    table:
      columns: [Criteria, TiDB, "{competitor}"]
      min_rows: 9
      max_rows: 11
      required_categories:
        - {id: primary_use, label: primary use / best fit, match: '(?i)primary use|best fit'}
        - {id: architecture, label: architecture, match: '(?i)architect|database model'}
        - {id: compatibility, label: SQL / protocol compatibility, match: '(?i)compatib|sql dialect|protocol'}
        - {id: consistency, label: consistency & transactions, match: '(?i)consisten|transaction|acid'}
        - {id: scaling, label: scaling model, match: '(?i)scal|shard'}
        - {id: analytics, label: HTAP / analytics, match: '(?i)htap|analytic'}
        - {id: availability, label: high availability / multi-region, match: '(?i)availab|multi[- ]region|locality|replication'}
        - {id: operations, label: operations / Kubernetes / deployment, match: '(?i)operation|kubernetes|deploy'}
        - {id: pricing_model, label: pricing model, match: '(?i)pricing|cost'}
      # A competitor cell may not be blank or a placeholder.
      empty_cell_pattern: '^(?:|-+|n/?a|none|no|unknown|not available|tbd)$'
      requires_sources: true
  - id: architecture
    label: architecture
    match: ['(?i)architect']
  - id: compatibility
    label: compatibility and migration
    match: ['(?i)compatib', '(?i)migrat']
  - id: scaling
    label: scaling, performance, and high availability
    match: ['(?i)scal', '(?i)perform', '(?i)consisten', '(?i)availab']
  - id: workloads
    label: HTAP, analytics, and AI workloads
    match: ['(?i)htap', '(?i)analytic', '(?i)\bai\b', '(?i)vector']
  - id: operations
    label: operations, deployment, and ecosystem
    match: ['(?i)operat', '(?i)kubernetes', '(?i)deploy', '(?i)ecosystem', '(?i)integration', '(?i)cloud[- ]native']
  - id: pricing
    label: pricing and total cost
    match: ['(?i)pricing', '(?i)\bcost', '(?i)\btco\b']
    pricing: true
  - id: decision
    label: who should choose TiDB vs [Competitor]
    match: ['(?i)who should', '(?i)choos', '(?i)checklist']
    required_terms: ['(?mi)^###\s+\**choose tidb if', '(?mi)^###\s+\**choose (?!tidb\b)\S.*\bif']
  - id: how_tidb_helps
    label: How TiDB helps teams [solve the problem named in the intro]
    match: ['(?i)^(?:how|where) tidb (?:helps|solves|fits)']
    requires_mechanism: true
    required_terms: ['(?i)\bintro']
  - id: faqs
    position: -1
    label: TiDB vs [Competitor] FAQs
    match: ['(?i)\bfaqs?\b', '(?i)frequently asked']

mechanisms:
  - distributed SQL on TiKV
  - TiKV
  - Raft
  - Multi-Raft
  - TiFlash
  - HTAP
  - native VECTOR type
  - VECTOR
  - PD placement driver
  - MVCC
  - two-phase commit
  - online DDL
  - TiDB Cloud Zero
  - per-agent isolation

guidance: |
  For comparison and alternative pages, follow the house format of the live
  pages under https://www.pingcap.com/compare/ (for example "TiDB vs OceanBase",
  "TiDB vs PostgreSQL", "Vitess vs TiDB"). The outline must contain exactly these
  10 H2s in this order. Name both products in headings and prefer question-style
  H2s that mirror search intent (for example "How do TiDB and [Competitor] differ
  in architecture?"). Keep each H2's purpose and the fixed wording noted below.

  **H2 1: "TiDB vs [Competitor] at a glance".** This is the page's AEO answer H2.
  Open with a 2 to 3 sentence self-contained answer to the primary keyword's core
  question, then the table. The table has exactly these columns:
  Criteria | TiDB | [Competitor name]. 9 to 11 rows, including rows for each of:
  primary use (or best fit), architecture, SQL / protocol compatibility,
  consistency and transactions, scaling model, HTAP / analytics, high availability
  / multi-region, operations (Kubernetes and deployment), pricing model. Fill
  every competitor cell with the competitor's actual capability and never omit
  competitor strengths. Under the table, add a "Sources:" line listing complete
  https:// source URLs for the competitor claims, marked "{{claims.verify_marker}}".
  Then add an H3 titled "Key differences" (a heading line; the writer lists the
  three or four differences that drive the decision).

  **H2 2: Architecture.** For example "How do TiDB and [Competitor] differ in
  architecture?". H3s: TiDB architecture (TiDB server, TiKV, PD, TiFlash),
  [Competitor] architecture, and what the design means for real workloads.

  In the brief, every H3 is a heading line only. Put the guidance in the H2's
  2 to 3 bullets.

  **H2 3: Compatibility and migration.** SQL dialect and protocol, drivers and
  ORMs, what needs testing, and a short migration path (assess, migrate and
  validate, cut over).

  **H2 4: Scaling, performance, and high availability.** Consistency and
  transactions, scaling model, failover and multi-region, and what to benchmark
  in a POC. Every performance number needs a year, conditions, and a source.

  **H2 5: HTAP, analytics, and AI workloads.** Real-time analytics on fresh
  transactional data, plus vector and AI workloads where relevant to the pair.

  **H2 6: Operations, deployment, and ecosystem.** Kubernetes, managed versus
  self-managed, backups and upgrades, CDC and integrations, governance and support.

  **H2 7: Pricing and total cost.** One H3 per product on cost drivers. Competitor
  numbers only with a source URL and year, each marked "{{claims.verify_marker}}".
  For TiDB, describe the billing model unless public numbers are verifiable from a
  pingcap.com source. A cost-area table (Cost area | TiDB | [Competitor]) is welcome.

  **H2 8: "Who should choose TiDB vs [Competitor]?".** Two H3s titled exactly
  "Choose TiDB if" and "Choose [Competitor] if". The H2 bullets name the concrete,
  honest selection criteria, including when the competitor is the better choice.

  **H2 9: "How TiDB helps teams [solve the problem named in the intro]".** The
  heading starts with "How TiDB helps" (or "How TiDB solves" / "Where TiDB fits").
  Name the actual mechanism (for example distributed SQL on TiKV/Raft, HTAP with
  TiFlash, the native VECTOR type) in the first sentence of the guidance and
  explicitly tie it back to the intro's problem. A generic feature list does not
  satisfy this. End with an H3 such as "Start your evaluation" carrying the
  primary CTA.

  **H2 10: "TiDB vs [Competitor] FAQs".** The last H2.

  Do not add a reviews or ratings H2: the live /compare/ pages do not have one.
  Do not add a "Key differences" H3 anywhere other than H2 1.

checklist: |
  23. The outline has the 10 comparison H2s in order: at a glance (with the AEO
      answer and a Key differences H3), architecture, compatibility and
      migration, scaling/performance/availability, HTAP/analytics/AI,
      operations and ecosystem, pricing and total cost, who should choose,
      How TiDB helps (with the primary CTA), FAQs last.
  24. The at-a-glance table has columns Criteria | TiDB | [Competitor], 9 to 11
      rows covering all nine required categories, every competitor cell filled,
      and a Sources line with complete https:// URLs.
  25. The decision H2 has "Choose TiDB if" and "Choose [Competitor] if" H3s.
  26. For alternative pages, the FAQ includes at least one question about a
      competitor capability and one about migration.
