# Fallback for product and playbook pages (blog posts use blog.yaml).
content_types:
- product
- playbook
max_h2: 10
faq_section: faqs
primary_cta_section: closing
mechanism_section: null
word_weights: null
sections:
# FAQs are the last H2 for every content type (reviewer feedback, Oct 2026).
- id: closing
  position: -2
  label: Closing section with the primary CTA
  match:
  - .
- id: faqs
  position: -1
  label: FAQs
  match:
  - (?i)\bfaqs?\b
  - (?i)frequently asked
guidance: |
  For this content type, end the outline with a closing H2 that resolves the intro
  and holds the primary CTA, followed by the FAQ H2 as the last H2.
checklist: ''
